[package]
name = "cc-switch-android-core"
version = "0.4.1"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[lib]
name = "cc_switch_android_core"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = []
test-hooks = []

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
flate2 = "1"
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process"] }
futures = "0.3"
rmcp = { version = "0.8.5", features = ["client", "transport-async-rw", "transport-sse-client-reqwest", "transport-streamable-http-client-reqwest"] }
process-wrap = { version = "8.2", features = ["tokio1"] }
async-stream = "0.3"
bytes = "1.5"
prost = "0.14"
axum = "0.7"
tower = "0.4"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
aho-corasick = "1.1"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
base64 = "0.22"
png = "0.18"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
json5 = "0.4"
json-five = "0.3.1"
sys-locale = "0.3"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
rquickjs = { version = "0.8", features = ["bindgen"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "~5.1.0", features = ["rt-async-io-crypto-rust"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["test-util"] }
